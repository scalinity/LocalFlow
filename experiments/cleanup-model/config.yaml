# LocalFlow cleanup-model experiment (PRODUCT_AUTOGENERATED data; not an M15 corpus).
experiment_id: localflow-cleanup-20261011
dataset_label: PRODUCT_AUTOGENERATED

paths:
  artifacts: experiments/cleanup-model/artifacts
  report_dir: reports/localflow-cleanup-comparison
  hf_home: ~/Documents/LocalAI/models
  adapters_root: ~/Documents/LocalAI/adapters
  env_file: .env                          # repo-relative; the key is read in-process only
  localai_python: ~/Documents/LocalAI/.venv/bin/python
  localflow_python: .venv/bin/python      # LocalFlow's own interpreter (repo-relative)

models:
  A:
    label: "A · Qwen3-4B-Instruct-2507 (incumbent)"
    repository_id: mlx-community/Qwen3-4B-Instruct-2507-4bit
    revision: 50d427756c6b1b2fe0c0a10f67fbda1fc8e82c1b
    quantization: "4-bit affine, group 64 (mlx-community)"
  B:
    label: "B · Qwen3.5-4B (untuned)"
    repository_id: mlx-community/Qwen3.5-4B-4bit
    revision: 0e7ffd5c629ef7719d4cbc04069232580bfa9d9c
    quantization: "4-bit affine, group 64"
  C:
    label: "C · Qwen3.5-4B + LocalFlow LoRA"
    repository_id: local/LocalFlow-Cleanup-Qwen3.5-4B-4bit
    quantization: "4-bit affine, group 64 (same recipe as B)"
  base_bf16:
    repository_id: Qwen/Qwen3.5-4B
    revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  asr:
    repository_id: mlx-community/parakeet-tdt-0.6b-v3
    revision: ed2b7e8c15f9aaa0b5772e2efb986255eaef7e15

claude:
  model: claude-sonnet-5-5
  # USD per million tokens, Message Batches API (50% of standard), verified on the
  # pricing page 2026-10-11. Cache write 1.25x input; cache read 0.05x base input.
  price_batch: {input: 1.00, output: 5.00, cache_write: 1.25, cache_read: 0.05}
  spend_cap_usd: 20.00
  stop_at_usd: 19.50
  reserve_usd: {verify: 2.5, judge: 1.5}
  families_per_request: 6
  generation_max_tokens: 6000
  verify_pairs_per_request: 6
  verify_max_tokens: 2500
  judge_max_tokens: 3000

targets:
  train_pairs: 6000
  validation_pairs: 400
  test_synthetic_pairs: 500   # grown from ~300 for power (see freeze.json MDE)
  test_synthetic_max: 500
  disfluencyspeech_cases: 250
  fleurs_cases: 250
  noop_share: 0.30
  max_words: 190
  dedup_jaccard: 0.6

datasets:
  disfluencyspeech: {repo: amaai-lab/DisfluencySpeech, revision: b7da294fe3a70dd96df6640893f2a5dfc2c87638, license: Apache-2.0}
  fleurs: {repo: google/fleurs, revision: 70bb2e84b976b7e960aa89f1c648e09c59f894dd, config: en_us, license: CC-BY-4.0}

training:
  seed: 20261011
  lora: {rank: 16, scale: 2.0, dropout: 0.05, num_layers: 32,
         keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj,
                linear_attn.in_proj_qkv, linear_attn.in_proj_z, linear_attn.out_proj,
                mlp.gate_proj, mlp.up_proj, mlp.down_proj]}
  learning_rate: 1.0e-4
  warmup_updates: 50
  batch_size: 1
  grad_accumulation: 8
  epochs: 1
  time_budget_hours: 6.0
  checkpoints: 5
  val_loss_examples: 100
  corrections_role_max_share: 0.25
  none_share_of_corrections: 0.40

evaluation:
  cold_load_repeats: 3
  pipeline_clips: 40
  pipeline_warmups: 2
  pipeline_repeats: 3
  fidelity_cases: 50
  judge_cases: 240
  bootstrap_resamples: 2000
  bootstrap_seed: 15

# Frozen recommendation rules (hashed into freeze.json before any final output).
rules:
  priorities: [meaning_preservation, useful_cleanup, responsiveness]
  meaning:
    model_only_damage_upper_ci_pp: 1.0
    delivered_damage_upper_ci_pp: 0.5
    real_audio_unauthorized_edit_upper_ci_pp: 0.5
    real_audio_wer_upper_ci_pp: 0.5
    fixtures_pass_rate_not_below_A: true
  useful_cleanup:
    delivered_repair_success_lower_ci_pp: 0.0
  responsiveness:
    warm_p95_max_ratio: 1.25
    cold_load_max_ratio: 2.0
  c_over_b:
    repair_success_lower_ci_pp: 0.0
    damage_upper_ci_pp: 0.5
  outcomes: [keep_A, switch_to_B, consider_C, insufficient_evidence]
